<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ENNTOR — a personal learning platform for independent thinking, deliberate practice, and confident performance." />
    <meta name="theme-color" content="#f4f3ec" />
    <title>ENNTOR — Make it your own.</title>
    <script>
      try {
        const saved = localStorage.getItem('enhtor.theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.querySelector('meta[name="theme-color"]').setAttribute(
        'content', document.documentElement.dataset.theme === 'dark' ? '#181b19' : '#f4f3ec'
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
